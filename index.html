<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collatz Conjecture Visualized</title>
    <meta
      name="description"
      content="An interactive tour of the Collatz conjecture: watch hailstone trajectories race each other, grow the reverse tree into coral, and sweep stopping times for a million starts."
    />
    <meta name="author" content="Cameron Scarpati" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#F6F7F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)" />
    <script>
      /* Set the theme before first paint; src/theme/theme.ts owns this logic for
         the app lifetime and its THEME_KEY must match the storage key here. */
      try {
        var theme = localStorage.getItem('collatz-theme')
        if (theme !== 'dark' && theme !== 'light')
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', theme)
      } catch (error) {
        /* Storage denied: the stylesheet default paints and initTheme() retries. */
      }
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Collatz Conjecture Visualized" />

      property="og:description"
      content="Halve it if it is even, triple it and add one if it is odd. Race hailstone trajectories, grow the reverse tree into coral, and chart stopping times for a million starts."

  <body>
    <div id="root"></div>
    <noscript>
      <p>
        This page is an interactive tour of the Collatz conjecture and needs JavaScript to
        run. The rule is simple: halve an even number, triple an odd number and add one, and
        repeat. The conjecture says every start eventually reaches 1, and nobody has proved
        it. The app animates hailstone trajectories on a log axis, grows the reverse tree
        into an organic coral whose edges bend by parity, and sweeps total stopping times
        for up to a million starts with the record setters highlighted. The source lives at
        <a href="https://github.com/CameronScarpati/collatz-conjecture-visualized"
          >github.com/CameronScarpati/collatz-conjecture-visualized</a
        >.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
